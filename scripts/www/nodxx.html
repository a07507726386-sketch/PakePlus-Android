<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>抖音风格·MCN专业看板 | 荣耀榜前十·动态营收+礼物系统</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js">
    </script>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #000;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            position: fixed;
        }

        /* ===== 视频层 ===== */
        .video-fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1;
        }

        #hlsVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        /* ===== UI 覆盖层 ===== */
        .ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none;
        }

        .ui-overlay>* {
            pointer-events: auto;
        }

        /* ===== 顶部栏 ===== */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.5) 0%, rgba(0, 0, 0, 0) 100%);
            backdrop-filter: blur(8px);
            z-index: 25;
        }

        .anchor-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .anchor-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ffc107;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.3);
            background: #1e1e26;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .anchor-avatar:active {
            transform: scale(0.96);
        }

        .live-badge {
            background: #ff2d55;
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            color: white;
        }

        .live-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            animation: pulse 1.2s infinite;
        }

        .stream-title {
            font-size: 14px;
            font-weight: 600;
            color: white;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
            max-width: 180px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .right-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .viewer-count {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            color: white;
        }

        .data-btn {
            background: rgba(108, 92, 231, 0.9);
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .data-btn:active {
            transform: scale(0.96);
            background: #5a4ad1;
        }

        /* ===== 聊天区域 ===== */
        .chat-overlay {
            position: absolute;
            bottom: 85px;
            left: 12px;
            width: 340px;
            max-width: 85vw;
            height: 25vh;
            background: transparent;
            backdrop-filter: none;
            border: none;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 30;
            pointer-events: none;
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0, 0, 0, 1) 15%);
            mask-image: linear-gradient(to bottom, transparent 0%, rgba(0, 0, 0, 1) 15%);
        }

        .chat-messages-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 6px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 6px;
            pointer-events: auto;
        }

        .chat-messages-list::-webkit-scrollbar {
            display: none;
        }

        /* 单条评论 */
        .comment-item {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            animation: fadeInUp 0.15s ease-out;
            width: fit-content;
        }

        .comment-avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            background: #3a3a4a;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
            display: block;
        }

        .comment-content {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(4px);
            padding: 4px 10px;
            border-radius: 12px;
            line-height: 1.4;
            font-size: 14px;
            color: #ffffff;
            text-shadow: 0 1px 1px rgba(0, 0, 0, 0.8), 0 0 1px rgba(0, 0, 0, 0.8);
            word-break: break-word;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
        }

        .comment-name {
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            margin-right: 6px;
            font-size: 13px;
        }

        .comment-text {
            color: #ffffff;
            font-weight: 400;
        }

        /* 礼物类评论（保留金色背景，但不显示图片） */
        .comment-item-gift .comment-content {
            background: rgba(255, 193, 7, 0.35);
            border: 0.5px solid rgba(255, 193, 7, 0.5);
        }

        .comment-item-gift .comment-text {
            color: #ffeb3b;
            font-weight: bold;
        }

        /* ===== 底部输入 ===== */
        .bottom-input-area {
            position: absolute;
            bottom: 20px;
            left: 12px;
            right: 12px;
            background: rgba(28, 28, 35, 0.7);
            backdrop-filter: blur(15px);
            border-radius: 40px;
            padding: 4px 12px 4px 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 35;
            border: 0.5px solid rgba(255, 255, 255, 0.2);
        }

        .bottom-input-area input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            padding: 10px 14px;
            border-radius: 40px;
            color: white;
            font-size: 14px;
            outline: none;
        }

        .bottom-input-area input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .bottom-input-area button {
            background: #fe2c55;
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }

        .bottom-input-area button:active {
            transform: scale(0.96);
            background: #e0254c;
        }

        /* ===== 遮罩 & 侧栏 ===== */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: 0.2s;
        }

        .overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* 营收留存版 → 银白色背景 + 黑色文字 */
        .mcn-panel {
            position: fixed;
            top: 0;
            right: -100%;
            width: 88%;
            max-width: 420px;
            height: 100%;
            background: #f0f2f5;
            z-index: 110;
            padding: 20px 16px;
            overflow-y: auto;
            transition: right 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border-left: 1px solid #dce0e5;
            box-shadow: -4px 0 20px rgba(0, 0, 0, 0.15);
            color: #1a1a2e;
        }

        .mcn-panel.open {
            right: 0;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid #dce0e5;
        }

        .panel-header h2 {
            font-size: 16px;
            color: #1a1a2e;
            font-weight: 700;
        }

        .close-panel {
            background: #e8ecf0;
            border: none;
            color: #1a1a2e;
            width: 32px;
            height: 32px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.15s;
        }

        .close-panel:hover {
            background: #d5d9e0;
        }

        .close-panel:active {
            transform: scale(0.94);
        }

        /* ===== 统计卡片 ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 10px 4px;
            text-align: center;
            border: 1px solid #dce0e5;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
        }

        .stat-label {
            font-size: 11px;
            color: #5a5a6e;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .stat-value {
            font-size: 16px;
            font-weight: 700;
            color: #1a1a2e;
        }

        .gold-value {
            color: #ffc107;
        }

        .usd-value {
            color: #1a1a2e;
        }

        .pink-value {
            color: #1a1a2e;
        }

        .green-value {
            color: #1a1a2e;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            margin: 16px 0 10px;
            color: #1a1a2e;
            border-left: 3px solid #6c5ce7;
            padding-left: 8px;
        }

        /* ===== 荣耀榜 ===== */
        .leaderboard-list {
            background: #ffffff;
            border-radius: 16px;
            padding: 8px;
            max-height: 260px;
            overflow-y: auto;
            border: 1px solid #e8ecf0;
        }

        .giver-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f5f7fa;
            margin-bottom: 6px;
            padding: 6px 10px;
            border-radius: 10px;
            border: 1px solid #eef0f4;
        }

        .rank-badge {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #dce0e5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 11px;
            color: #1a1a2e;
        }

        .rank-1 {
            background: #ffc107;
            color: #1a1a2e;
        }

        .rank-2 {
            background: #c0c0c0;
            color: #1a1a2e;
        }

        .rank-3 {
            background: #cd7f32;
            color: #1a1a2e;
        }

        .avatar-sm {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            background: #dce0e5;
        }

        .giver-name {
            font-weight: 600;
            font-size: 12px;
            color: #1a1a2e;
        }

        .giver-coins {
            font-size: 11px;
            color: #ffc107;
            font-weight: 600;
        }

        /* ===== 流状态表格 ===== */
        .stream-table {
            width: 100%;
            font-size: 12px;
            border-collapse: collapse;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e8ecf0;
        }

        .stream-table td,
        .stream-table th {
            padding: 8px 10px;
            border-bottom: 1px solid #eef0f4;
            color: #1a1a2e;
            text-align: left;
        }

        .stream-table th {
            font-weight: 600;
            color: #5a5a6e;
            background: #f7f9fc;
        }

        .stream-table tr:last-child td {
            border-bottom: none;
        }

        .tag-live {
            border-radius: 30px;
            padding: 2px 10px;
            font-size: 10px;
            font-weight: 600;
            background: #e8f5e9;
            color: #2e7d32;
            display: inline-block;
        }

        /* ===== 模态框 ===== */
        .custom-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
            pointer-events: none;
        }

        .custom-modal.show {
            visibility: visible;
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            width: 90%;
            max-width: 380px;
            background: #f0f2f5;
            border-radius: 28px;
            border: 1px solid #dce0e5;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            max-height: 80vh;
            overflow-y: auto;
            color: #1a1a2e;
        }

        .modal-card h3 {
            color: #1a1a2e;
            font-size: 18px;
            margin-bottom: 12px;
            text-align: center;
        }

        .modal-field {
            margin-bottom: 12px;
        }

        .modal-field label {
            display: block;
            font-size: 11px;
            color: #5a5a6e;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .modal-field input {
            width: 100%;
            background: #ffffff;
            border: 1px solid #dce0e5;
            padding: 10px 14px;
            border-radius: 20px;
            color: #1a1a2e;
            font-size: 13px;
            outline: none;
            transition: 0.15s;
        }

        .modal-field input:focus {
            border-color: #6c5ce7;
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.15);
        }

        .modal-field input::placeholder {
            color: #9a9aae;
        }

        .row-2col {
            display: flex;
            gap: 10px;
        }

        .row-2col .modal-field {
            flex: 1;
        }

        .play-stream-btn {
            background: #e8ecf0;
            border: 1px solid #6c5ce7;
            color: #6c5ce7;
            width: 100%;
            padding: 8px;
            border-radius: 20px;
            font-weight: 600;
            margin-bottom: 6px;
            cursor: pointer;
            transition: 0.15s;
        }

        .play-stream-btn:active {
            transform: scale(0.98);
            background: #d5d9e0;
        }

        .apply-modal-btn {
            background: #6c5ce7;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            font-size: 14px;
            margin-top: 6px;
            cursor: pointer;
            transition: 0.15s;
        }

        .apply-modal-btn:active {
            transform: scale(0.98);
            background: #5a4ad1;
        }

        .close-modal-btn {
            background: transparent;
            border: 1px solid #dce0e5;
            width: 100%;
            padding: 8px;
            border-radius: 20px;
            color: #5a5a6e;
            margin-top: 8px;
            cursor: pointer;
            transition: 0.15s;
        }

        .close-modal-btn:active {
            transform: scale(0.98);
            background: #e8ecf0;
        }

        /* 辅助提示：显示当前存储状态 */
        .save-indicator {
            font-size: 10px;
            color: #6c5ce7;
            text-align: center;
            margin-top: 4px;
            opacity: 0.7;
            font-weight: 500;
        }

        /* ===== Toast ===== */
        .toast-message {
            position: fixed;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            color: white;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 13px;
            z-index: 210;
            border: 1px solid rgba(255, 255, 255, 0.2);
            pointer-events: none;
        }

        .toast-animate {
            animation: fadeOut 2s ease forwards;
        }

        /* ===== 动画 ===== */
        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeOut {
            0% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }

            70% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
        }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            .chat-overlay {
                width: 290px;
                bottom: 80px;
                left: 8px;
            }

            .mcn-panel {
                width: 92%;
                padding: 16px 12px;
            }

            .stats-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 6px;
            }

            .stat-value {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <!-- ===== 视频容器 ===== -->
    <div class="video-fullscreen">
        <video id="hlsVideo" autoplay playsinline webkit-playsinline></video>
    </div>

    <!-- ===== UI 覆盖层 ===== -->
    <div class="ui-overlay">

        <!-- 顶部栏 -->
        <div class="top-bar">
            <div class="anchor-info">
                <img class="anchor-avatar" id="anchorAvatar" src="https://i.pravatar.cc/150?img=32" alt="主播头像">
                <div class="stream-title" id="streamTitle">✨小可儿·巅峰之夜✨</div>
                <div class="live-badge">LIVE</div>
            </div>
            <div class="right-actions">
                <span class="viewer-count">👥 <span id="onlineCount">1,248</span></span>
                <img src="imge/shuju.png" id="openDataBtn" alt="数据看板" style="height:24px;width:24px;cursor:pointer;"
                    onerror="this.style.display='none';">
            </div>
        </div>

        <!-- 聊天列表 -->
        <div class="chat-overlay">
            <div class="chat-messages-list" id="chatMessagesList"></div>
        </div>

        <!-- 底部输入 -->
        <div class="bottom-input-area">
            <input type="text" id="chatInput" placeholder="发条弹幕加入互动..." maxlength="45">
            <button id="sendCommentBtn">发送</button>
        </div>
    </div>

    <!-- ===== 遮罩 ===== -->
    <div class="overlay" id="panelOverlay"></div>

    <!-- ===== MCN 侧栏 (营收留存版 · 银白色主题) ===== -->
    <div class="mcn-panel" id="mcnPanel">
        <div class="panel-header">
            <h2>📊 营收留存板</h2>
            <button class="close-panel" id="closePanelBtn">✕</button>
        </div>

        <div class="section-title">💰 核心营收指标</div>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">累计打赏</div>
                <div class="stat-value" id="statCoins">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">本场营收</div>
                <div class="stat-value" id="statUsd">$0.00</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">打赏付费率</div>
                <div class="stat-value" id="statPayRate">4.2%</div>
            </div>
        </div>

        <div class="section-title">📈 粉丝与流量留存</div>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">当前在线</div>
                <div class="stat-value" id="statCurrent">1,248</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">巅峰同在</div>
                <div class="stat-value" id="statPeak">1,892</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">累计场观</div>
                <div class="stat-value" id="statTotal">5,621</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">人均停留</div>
                <div class="stat-value" id="statStayTime">2m 45s</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">本场新增关注</div>
                <div class="stat-value" id="statNewFollows">+382</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">公屏互动率</div>
                <div class="stat-value" id="statChatRate">12.8%</div>
            </div>
        </div>

        <div class="section-title">⏱️ 开播状态</div>
        <div class="stats-grid" style="grid-template-columns:repeat(2,1fr);">
            <div class="stat-card">
                <div class="stat-label">直播时长</div>
                <div class="stat-value" id="statDuration">00:00:00</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">打赏破冰人数</div>
                <div class="stat-value" id="statIceBreak">0 人</div>
            </div>
        </div>

        <div class="section-title">🏆 荣耀榜</div>
        <div class="leaderboard-list" id="leaderboardList"></div>

        <div class="section-title">📡 网络流状态</div>
        <table class="stream-table">
            <tr>
                <th>流码率</th>
                <td id="tbBitrate">6,200 kbps</td>
                <td><span class="tag-live">稳定</span></td>
            </tr>
            <tr>
                <th>帧率</th>
                <td id="tbFps">60 fps</td>
                <td><span class="tag-live">流畅</span></td>

            // ================================================================
            document.getElementById('sendCommentBtn').addEventListener('click', function() {
                var txt = document.getElementById('chatInput').value.trim();
                if (txt) {
                    var container = document.getElementById('chatMessagesList');
                    var userName = '·观众我';
                    var commentDiv = document.createElement('div');
                    commentDiv.className = 'comment-item';
                    var avatarNum = getAvatarNumber(userName);
                    var avatarImg = document.createElement('img');
                    avatarImg.className = 'comment-avatar';
                    avatarImg.src = 'images/' + avatarNum + '.png';
                    avatarImg.onerror = function() {
                        if (!avatarImg.getAttribute('data-fallback')) {
                            avatarImg.setAttribute('data-fallback', 'true');
                            avatarImg.style.background = '#6c5ce7';
                        }

                    var contentDiv = document.createElement('div');
                    contentDiv.className = 'comment-content';

                    nameSpan.className = 'comment-name';

                    textSpan.className = 'comment-text';
                    textSpan.innerText = ' ：' + txt;
                    contentDiv.appendChild(nameSpan);
                    contentDiv.appendChild(textSpan);
                    commentDiv.appendChild(avatarImg);
                    commentDiv.appendChild(contentDiv);
                    container.appendChild(commentDiv);
                    container.scrollTop = container.scrollHeight;
                    while (container.children.length > 50) container.removeChild(container.firstChild);
                    document.getElementById('chatInput').value = '';
                }

            document.getElementById('chatInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') document.getElementById('sendCommentBtn').click();

            // ================================================================
            document.getElementById('openDataBtn').addEventListener('click', function() {
                document.getElementById('mcnPanel').classList.add('open');
                document.getElementById('panelOverlay').classList.add('show');
            });
            document.getElementById('closePanelBtn').addEventListener('click', function() {
                document.getElementById('mcnPanel').classList.remove('open');
                document.getElementById('panelOverlay').classList.remove('show');
            });
            document.getElementById('panelOverlay').addEventListener('click', function() {
                document.getElementById('mcnPanel').classList.remove('open');
                document.getElementById('panelOverlay').classList.remove('show');
            });

            //  17. 主播后台模态框 (含累计打赏和本场收益自定义)
            // ================================================================
            var modal = document.getElementById('dataModal');
            var anchorImg = document.getElementById('anchorAvatar');
            var currentM3U8 = globalState.m3u8Url || '';

            function openModalFill() {
                document.getElementById('modalStreamerTitle').value = globalState.streamTitle || '';
                document.getElementById('modalAvatarUrl').value = globalState.avatarUrl || '';
                var totalCoinsVal = globalState.customTotalCoins !== null ? globalState.customTotalCoins : '';
                document.getElementById('modalTotalCoins').value = totalCoinsVal;
                var revenueVal = globalState.customRevenue !== null ? globalState.customRevenue : (globalState
                    .top10RevenueCoins / 100);
                document.getElementById('modalRevenue').value = revenueVal.toFixed(2);
                document.getElementById('modalCurrent').value = globalState.current;
                document.getElementById('modalTotalViews').value = globalState.totalViews;
                document.getElementById('modalPeak').value = globalState.peak;
                document.getElementById('modalStayMin').value = globalState.stayMinutes;
                document.getElementById('modalNewFollows').value = globalState.newFollows;
                document.getElementById('modalChatRate').value = globalState.chatRate;
                document.getElementById('modalDuration').value = globalState.seconds;
                document.getElementById('modalM3u8Url').value = currentM3U8;
                modal.classList.add('show');
            }

            function applySync() {
                var newTitle = document.getElementById('modalStreamerTitle').value.trim();
                if (newTitle) {
                    globalState.streamTitle = newTitle;
                }
                var avatarUrl = document.getElementById('modalAvatarUrl').value.trim();
                if (avatarUrl) {
                    globalState.avatarUrl = avatarUrl;
                    document.getElementById('anchorAvatar').src = avatarUrl;
                }

                var totalCoinsVal = document.getElementById('modalTotalCoins').value.trim();
                if (totalCoinsVal !== '') {
                    var parsed = parseFloat(totalCoinsVal);
                    if (!isNaN(parsed) && parsed >= 0) {
                        globalState.customTotalCoins = Math.round(parsed);
                    } else {
                        globalState.customTotalCoins = null;
                    }
                } else {
                    globalState.customTotalCoins = null;
                }

                var revenueVal = parseFloat(document.getElementById('modalRevenue').value);
                if (!isNaN(revenueVal) && revenueVal >= 0) {
                    globalState.customRevenue = revenueVal;
                } else {
                    globalState.customRevenue = null;
                }

                if (document.getElementById('modalCurrent').valueAsNumber >= 0) globalState.current = document
                    .getElementById('modalCurrent').valueAsNumber;
                if (document.getElementById('modalTotalViews').valueAsNumber >= 0) globalState.totalViews = document
                    .getElementById('modalTotalViews').valueAsNumber;
                if (document.getElementById('modalPeak').valueAsNumber >= 0) globalState.peak = document.getElementById(
                    'modalPeak').valueAsNumber;
                if (document.getElementById('modalStayMin').valueAsNumber > 0) globalState.stayMinutes = document
                    .getElementById('modalStayMin').valueAsNumber;
                if (document.getElementById('modalNewFollows').valueAsNumber >= 0) globalState.newFollows = document
                    .getElementById('modalNewFollows').valueAsNumber;
                if (document.getElementById('modalChatRate').valueAsNumber >= 0) globalState.chatRate = document
                    .getElementById('modalChatRate').valueAsNumber;
                if (document.getElementById('modalDuration').valueAsNumber >= 0) globalState.seconds = document
                    .getElementById('modalDuration').valueAsNumber;

                var m3u8 = document.getElementById('modalM3u8Url').value.trim();
                if (m3u8) {
                    saveM3U8(m3u8);
                    currentM3U8 = m3u8;
                }

                updateAllUI();
                saveStateToStorage();
                modal.classList.remove('show');
                showToast('✅ 所有数据已同步并自动保存到浏览器');
            }

                modal.classList.remove('show');

            // ================================================================
            //  18. HLS 直播流
            // ================================================================
            var videoEl = document.getElementById('hlsVideo');
            var hls = null;

            function loadM3U8(url, startMuted) {
                startMuted = (startMuted !== undefined) ? startMuted : true;
                if (!url) return;
                if (hls) {
                    hls.destroy();
                    hls = null;
                }
                videoEl.muted = startMuted;
                if (Hls.isSupported()) {
                    hls = new Hls({ capLevelToPlayerSize: true });
                    hls.loadSource(url);
                    hls.attachMedia(videoEl);
                    hls.on(Hls.Events.MANIFEST_PARSED, function() {
                        videoEl.play().catch(function(e) { console.log(e); });
                    });
                } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
                    videoEl.src = url;
                    videoEl.play().catch(function(e) { console.log(e); });
                }
                currentM3U8 = url;
                globalState.m3u8Url = url;
                saveStateToStorage();
            }

                }
            }

            initRankingWithRandomGivers();
            updateAllUI();
            saveStateToStorage();

        })();
